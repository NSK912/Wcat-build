name: Build Electron Linux AppImage (x64 + ARM64)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux AppImage (x64 + ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          node -e "if (require('fs').existsSync('package-lock.json')) require('fs').unlinkSync('package-lock.json')"
          npm install --include=optional

      - name: Generate all icon sizes
        run: node scripts/generate-icons.js

      - name: Build Linux AppImage (x64 + ARM64)
        run: |
          npm run build
          npx tsc electron/main.ts --outDir dist-electron --target esnext --module nodenext --moduleResolution nodenext
          npx electron-builder --linux AppImage --x64 --arm64 --publish never

      - name: Upload AppImage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: release/*.AppImage
