name: Build Windows Native ARM64 EXE (Electron)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-arm64-exe:
    name: Build Windows Native ARM64 NSIS EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: |
          node -e "if (require('fs').existsSync('package-lock.json')) require('fs').unlinkSync('package-lock.json')"
          npm install --include=optional

      - name: Package Native Windows ARM64 EXE (NSIS)
        run: npm run electron:build:win:arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact (Native ARM64 EXE)
        uses: actions/upload-artifact@v4
        with:
          name: Wcat-Windows-ARM64-EXE
          path: release/*arm64*.exe

      - name: Create GitHub Release and Upload ARM64 EXE
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v3.5.3
          name: Wcat v3.5.3
          files: release/*arm64*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
